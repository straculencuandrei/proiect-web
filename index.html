<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>walliez</title>
  <meta name="description" content="walliez link-in-bio profile. developer & designer.">
  <meta name="author" content="walliez">

  <!-- Google Fonts: Outfit and Fira Code for premium bio aesthetics -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">

  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Full-screen matrix background -->
  <div class="background-wrapper" id="background-wrapper">
    <div class="ambient-glow"></div>
    <div class="lightning-overlay"></div>
    <canvas id="lightning-canvas" class="lightning-canvas"></canvas>
    <div class="cloud-bg cloud-1"></div>
    <div class="cloud-bg cloud-2"></div>
    <div id="stars-container" class="stars-container"></div>
    
    <!-- Scalable Forest SVG layers at the bottom -->
    <svg class="forest-background" viewBox="0 0 1440 320" preserveAspectRatio="none">
      <defs>
        <!-- Reusable Symmetrical Pine Tree Silhouette -->
        <g id="pine-tree">
          <path d="M 0 -110 
                   L 15 -80 L 6 -80 
                   L 25 -50 L 12 -50 
                   L 35 -15 L 18 -15 
                   L 45 30 L -45 30 
                   L -18 -15 L -35 -15 
                   L -12 -50 L -25 -50 
                   L -6 -80 L -15 -80 Z" />
        </g>
      </defs>
      
      <!-- Far Forest Layer (Purple tinted, illuminated on lightning flashes) -->
      <g class="forest-far">
        <g class="wind-tree w1"><use href="#pine-tree" x="80" y="240" transform="scale(1.2)" /></g>
        <g class="wind-tree w2"><use href="#pine-tree" x="220" y="250" transform="scale(1)" /></g>
        <g class="wind-tree w3"><use href="#pine-tree" x="360" y="230" transform="scale(1.3)" /></g>
        <g class="wind-tree w1"><use href="#pine-tree" x="500" y="260" transform="scale(0.9)" /></g>
        <g class="wind-tree w2"><use href="#pine-tree" x="640" y="240" transform="scale(1.15)" /></g>
        <g class="wind-tree w3"><use href="#pine-tree" x="780" y="250" transform="scale(1)" /></g>
        <g class="wind-tree w1"><use href="#pine-tree" x="920" y="220" transform="scale(1.4)" /></g>
        <g class="wind-tree w2"><use href="#pine-tree" x="1060" y="260" transform="scale(0.95)" /></g>
        <g class="wind-tree w3"><use href="#pine-tree" x="1200" y="240" transform="scale(1.2)" /></g>
        <g class="wind-tree w1"><use href="#pine-tree" x="1340" y="250" transform="scale(1.1)" /></g>
        <rect x="0" y="255" width="1440" height="70" />
      </g>
      
      <!-- Near Forest Layer (Deep solid black, partially illuminated by flashes) -->
      <g class="forest-near">
        <g class="wind-tree w3"><use href="#pine-tree" x="40" y="270" transform="scale(0.9)" /></g>
        <g class="wind-tree w1"><use href="#pine-tree" x="150" y="260" transform="scale(1.1)" /></g>
        <g class="wind-tree w2"><use href="#pine-tree" x="290" y="280" transform="scale(0.85)" /></g>
        <g class="wind-tree w3"><use href="#pine-tree" x="420" y="265" transform="scale(1)" /></g>
        <g class="wind-tree w1"><use href="#pine-tree" x="580" y="270" transform="scale(0.95)" /></g>
        <g class="wind-tree w2"><use href="#pine-tree" x="710" y="255" transform="scale(1.15)" /></g>
        <g class="wind-tree w3"><use href="#pine-tree" x="850" y="275" transform="scale(0.8)" /></g>
        <g class="wind-tree w1"><use href="#pine-tree" x="980" y="260" transform="scale(1.05)" /></g>
        <g class="wind-tree w2"><use href="#pine-tree" x="1120" y="270" transform="scale(0.9)" /></g>
        <g class="wind-tree w3"><use href="#pine-tree" x="1270" y="255" transform="scale(1.1)" /></g>
        <g class="wind-tree w1"><use href="#pine-tree" x="1390" y="275" transform="scale(0.85)" /></g>
        <rect x="0" y="280" width="1440" height="45" />
      </g>
    </svg>
  </div>

  <!-- Main Container -->
  <main class="container">

    <!-- Profile Card (Glassmorphic) -->
    <div class="profile-card">

      <!-- Header Section (Avatar, Name, Badges) -->
      <div class="card-header">
        <div class="avatar-wrapper">
          <img src="favicon.png" alt="walliez" class="avatar">
          <div class="avatar-ring"></div>
        </div>

        <div class="name-section">
          <h1 class="profile-name">walliez</h1>
          <div class="badge-list">
            <!-- Blue Verified Badge -->
            <div class="badge-item" title="Verified Account">
              <svg class="badge-icon verified" viewBox="0 0 24 24" fill="#38bdf8">
                <path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10 10-4.5 10-10S17.5 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
              </svg>
            </div>
            <!-- Developer Badge -->
            <div class="badge-item" title="Developer">
              <svg class="badge-icon dev" viewBox="0 0 24 24" fill="#a855f7">
                <path d="M9.4 16.6L4.8 12l4.6-4.6L8 6l-6 6 6 6 1.4-1.4zm5.2 0l4.6-4.6-4.6-4.6L16 6l6 6-6 6-1.4-1.4z"/>
              </svg>
            </div>
          </div>
        </div>

        <p class="profile-tag">@walliez</p>
      </div>

      <!-- Bio Monospace Typing Segment -->
      <div class="card-bio">
        <p class="bio-text">developer & designer. building cool things in the shadows.</p>
        <div class="bio-detail">
          <span class="bio-stat">⚡ coding in js & css</span>
          <span class="bio-divider">•</span>
          <span class="bio-stat">📍 shadows</span>
        </div>
      </div>

      <!-- Divider line -->
      <hr class="card-divider">

      <!-- Socials / Links Section -->
      <div class="links-section">
        
        <!-- Discord Card -->
        <div class="link-card discord" id="discord-btn">
          <div class="link-left">
            <svg class="link-icon" viewBox="0 0 127.14 96.36" fill="currentColor">
              <path d="M107.7,8.07A105.15,105.15,0,0,0,77.26,0a77.19,77.19,0,0,0-3.3,6.83A96.67,96.67,0,0,0,52.8,6.83,77.19,77.19,0,0,0,49.5,0,105.15,105.15,0,0,0,19.06,8.07C-3.79,42.06-1,75.22,14.14,95.54a106,106,0,0,0,31.84,16.07,79.52,79.52,0,0,0,6.72-10.93,68.79,68.79,0,0,1-10.63-5.11c.91-.66,1.8-1.34,2.65-2a75.58,75.58,0,0,0,85,0c.85.69,1.74,1.37,2.65,2a68.42,68.42,0,0,1-10.63,5.11,79.52,79.52,0,0,0,6.72,10.93,106,106,0,0,0,31.84-16.07C129.47,75.22,132.32,42.06,107.7,8.07ZM42.45,65.69C36.18,65.69,31,60,31,53S36.18,40.36,42.45,40.36,53.83,46,53.83,53,48.72,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.24,60,73.24,53S78.41,40.36,84.69,40.36,96.07,46,96.07,53,91,65.69,84.69,65.69Z"/>
            </svg>
            <div class="link-texts">
              <span class="link-title">Discord</span>
              <span class="link-subtitle">@walliez</span>
            </div>
          </div>
          <svg class="link-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
        </div>

        <!-- GitHub Link -->
        <a href="https://github.com/straculencuandrei" target="_blank" class="link-card github">
          <div class="link-left">
            <svg class="link-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/>
            </svg>
            <div class="link-texts">
              <span class="link-title">GitHub</span>
              <span class="link-subtitle">straculencuandrei</span>
            </div>
          </div>
          <svg class="link-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
        </a>

        <!-- Steam Link -->
        <div class="link-card steam" id="steam-btn">
          <div class="link-left">
            <svg class="link-icon" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 2a10 10 0 0 0-7.88 16.17l3.77-2.17a3.25 3.25 0 0 1 5.75-2.48l2.67-3.8A3.25 3.25 0 1 1 12 2zm1 7.25a2.25 2.25 0 1 0 2.25 2.25A2.25 2.25 0 0 0 13 9.25z"/>
            </svg>
            <div class="link-texts">
              <span class="link-title">Steam</span>
              <span class="link-subtitle">walliez</span>
            </div>
          </div>
          <svg class="link-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
        </div>

      </div>

      <!-- Divider line -->
      <hr class="card-divider">

      <!-- Interactive Music Toggler (Bottom) -->
      <div class="music-player" id="music-player">
        <div class="player-left">
          <div class="vinyl-wrapper" id="vinyl-disc">
            <div class="vinyl-center"></div>
          </div>
          <div class="track-details">
            <span class="track-title" id="track-title">Silent Lofi Night</span>
            <span class="track-author">walliez ambient</span>
          </div>
        </div>
        
        <div class="wave-visualizer" id="wave-vis">
          <div class="bar"></div>
          <div class="bar"></div>
          <div class="bar"></div>
          <div class="bar"></div>
        </div>
      </div>

    </div>

    <!-- Hidden dynamic interactive popup -->
    <div class="toast-popup" id="toast-popup">
      <span>Copied! Discord tag copied to clipboard.</span>
    </div>

  </main>

  <script src="script.js"></script>
</body>
</html>
