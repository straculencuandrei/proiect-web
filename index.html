<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>walliez</title>
  <meta name="description" content="A quiet, minimalist space featuring a cozy cat loaf.">
  <meta name="author" content="walliez">

  <!-- Google Fonts: Outfit for clean typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Main centered interactive container -->
  <main class="container" id="interactive-container">

    <!-- Simple, borderless animation wrapper -->
    <div class="animation-wrapper" id="animation-wrapper">
      
      <!-- The Minimalist Cat Loaf SVG -->
      <svg class="cat-svg" viewBox="0 0 600 600" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <!-- Subtle drop shadow on the cat loaf -->
          <filter id="loaf-shadow" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.5" />
          </filter>

          <!-- Sleek off-white to soft grey body gradient -->
          <linearGradient id="loaf-body-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#fafafa" />
            <stop offset="100%" stop-color="#e8e8e9" />
          </linearGradient>

          <!-- Inside ears dark gradient -->
          <linearGradient id="ear-dark-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#a1a1aa" />
            <stop offset="100%" stop-color="#71717a" />
          </linearGradient>
        </defs>

        <!-- Soft floor shadow under the loaf -->
        <ellipse cx="300" cy="426" rx="120" ry="12" fill="rgba(255, 255, 255, 0.03)" />

        <!-- THE CAT LOAF CHARACTER -->
        <g id="cat-loaf" filter="url(#loaf-shadow)">
          
          <!-- Cat Loaf Body -->
          <path id="loaf-body" d="M 200 410 C 180 340, 200 290, 300 290 C 400 290, 420 340, 400 410 C 395 425, 205 425, 200 410 Z" fill="url(#loaf-body-grad)" />

          <!-- Curled Tail along the side -->
          <path id="loaf-tail" d="M 200 410 Q 300 428 380 406" fill="none" stroke="url(#loaf-body-grad)" stroke-width="18" stroke-linecap="round" />

          <!-- Tiny Tucked Front Left Paw -->
          <ellipse cx="282" cy="413" rx="11" ry="8" fill="url(#loaf-body-grad)" />
          <line x1="282" y1="409" x2="282" y2="417" stroke="#d4d4d8" stroke-width="1.5" />

          <!-- Tiny Tucked Front Right Paw -->
          <ellipse cx="318" cy="413" rx="11" ry="8" fill="url(#loaf-body-grad)" />
          <line x1="318" y1="409" x2="318" y2="417" stroke="#d4d4d8" stroke-width="1.5" />

          <!-- Animated Head Group -->
          <g id="cat-head">
            
            <!-- Left Ear -->
            <path d="M 250 210 L 230 140 L 280 185 Z" fill="url(#ear-dark-grad)" />
            <path d="M 253 205 L 238 152 L 275 186 Z" fill="#fee2e2" /> <!-- Soft pink inner -->
            
            <!-- Right Ear -->
            <path d="M 350 210 L 370 140 L 320 185 Z" fill="url(#ear-dark-grad)" />
            <path d="M 347 205 L 362 152 L 325 186 Z" fill="#fee2e2" /> <!-- Soft pink inner -->

            <!-- Head shape -->
            <ellipse cx="300" cy="240" rx="58" ry="46" fill="url(#loaf-body-grad)" />

            <!-- Eyes Group (mouse tracking) -->
            <g id="cat-eyes-group">
              <!-- Left Eye -->
              <path id="cat-eye-left" class="cat-eye" d="M 262 242 Q 272 235 282 242" fill="none" stroke="#27272a" stroke-width="4.5" stroke-linecap="round" />
              <!-- Right Eye -->
              <path id="cat-eye-right" class="cat-eye" d="M 318 242 Q 328 235 338 242" fill="none" stroke="#27272a" stroke-width="4.5" stroke-linecap="round" />
            </g>

            <!-- Cozy Pink Cheeks -->
            <ellipse cx="250" cy="252" rx="8" ry="5" fill="#fecdd3" opacity="0.7" />
            <ellipse cx="350" cy="252" rx="8" ry="5" fill="#fecdd3" opacity="0.7" />

            <!-- Nose & Cozy Mouth -->
            <path d="M 297 253 L 303 253 L 300 257 Z" fill="#27272a" />
            <path d="M 294 261 Q 300 266 306 261" fill="none" stroke="#27272a" stroke-width="2.5" stroke-linecap="round" />
          </g>

        </g>
      </svg>
      
      <!-- Minimal Speech Bubble (pops up on interaction) -->
      <div class="speech-bubble" id="speech-bubble">
        <span>prr?</span>
      </div>

    </div>

  </main>

  <script src="script.js"></script>
</body>
</html>
