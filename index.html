<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>walliez | Cozy Minimalist Cat Space</title>
  <meta name="description" content="Welcome to the cozy space of walliez, featuring a playful minimalist cat batting a toy yarn ball. Created with clean aesthetics and smooth motion.">
  <meta name="author" content="walliez">

  <!-- Google Fonts: Outfit for sleek modern typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
  
  <!-- FontAwesome for clean minimalist icons (if we add links later) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Ambient background glow blobs -->
  <div class="glow-bg">
    <div class="blob blob-purple"></div>
    <div class="blob blob-blue"></div>
    <div class="blob blob-coral"></div>
  </div>

  <!-- Main interactive canvas container -->
  <main class="container" id="interactive-container">
    
    <!-- Title Layer: Layered behind or over the cat beautifully with high contrast -->
    <h1 class="brand-title" id="brand-title">walliez</h1>

    <!-- Animation Card Container -->
    <div class="animation-wrapper" id="animation-wrapper">
      
      <!-- The Minimalist Playful Cat SVG -->
      <svg class="cat-svg" viewBox="0 0 600 600" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <!-- Soft glow filter for the ball and interactive elements -->
          <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="8" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
          </filter>

          <!-- Drop shadow for the cat structure to create subtle 3D separation -->
          <filter id="cat-shadow" x="-10%" y="-10%" width="125%" height="125%">
            <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#020617" flood-opacity="0.25" />
          </filter>

          <!-- Linear gradients for premium aesthetic coloring -->
          <linearGradient id="cat-body-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ffffff" />
            <stop offset="100%" stop-color="#e2e8f0" />
          </linearGradient>

          <linearGradient id="cat-dark-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#94a3b8" />
            <stop offset="100%" stop-color="#64748b" />
          </linearGradient>

          <linearGradient id="ball-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ff7e5f" />
            <stop offset="100%" stop-color="#feb47b" />
          </linearGradient>

          <linearGradient id="floor-shadow-grad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#020617" stop-opacity="0.4" />
            <stop offset="100%" stop-color="#020617" stop-opacity="0.0" />
          </linearGradient>
        </defs>

        <!-- Dynamic shadows on the floor -->
        <ellipse class="shadow-floor shadow-cat-floor" cx="280" cy="455" rx="140" ry="18" fill="url(#floor-shadow-grad)" />
        <ellipse class="shadow-floor shadow-ball-floor" id="shadow-ball-floor" cx="420" cy="455" rx="20" ry="6" fill="url(#floor-shadow-grad)" />

        <!-- THE PLAYFUL CAT GROUP -->
        <g id="cat-character" filter="url(#cat-shadow)">
          
          <!-- Animated Tail -->
          <path id="cat-tail" d="M 190 430 C 120 435, 90 360, 110 300 C 120 270, 150 260, 140 230" 
                fill="none" stroke="url(#cat-body-grad)" stroke-width="20" stroke-linecap="round" />

          <!-- Back Foot/Leg -->
          <ellipse cx="205" cy="442" rx="28" ry="15" fill="url(#cat-body-grad)" />
          <circle cx="215" cy="432" r="4" fill="#e2e8f0" />
          <circle cx="225" cy="435" r="4" fill="#e2e8f0" />

          <!-- Cat Body -->
          <path id="cat-body" d="M 180 440 C 170 340, 220 290, 280 290 C 330 290, 345 340, 340 440 Z" fill="url(#cat-body-grad)" />

          <!-- Front Right Leg (Steady resting on ground) -->
          <ellipse cx="320" cy="440" rx="16" ry="18" fill="url(#cat-body-grad)" />
          <ellipse cx="320" cy="454" rx="16" ry="6" fill="#cbd5e1" opacity="0.5" />

          <!-- Animated Head Group -->
          <g id="cat-head">
            
            <!-- Left Ear -->
            <path d="M 235 220 L 215 150 L 265 190 Z" fill="url(#cat-dark-grad)" />
            <path d="M 238 215 L 223 162 L 260 192 Z" fill="#fecdd3" /> <!-- Inner pink -->
            
            <!-- Right Ear -->
            <path d="M 325 220 L 345 150 L 295 190 Z" fill="url(#cat-dark-grad)" />
            <path d="M 322 215 L 337 162 L 300 192 Z" fill="#fecdd3" /> <!-- Inner pink -->

            <!-- Head Circle -->
            <ellipse cx="280" cy="236" rx="56" ry="46" fill="url(#cat-body-grad)" />

            <!-- Animated Eyes Group (for cursor tracking) -->
            <g id="cat-eyes-group">
              <!-- Left Eye (Happy sleeping curve) -->
              <path id="cat-eye-left" class="cat-eye" d="M 242 238 Q 252 231 262 238" fill="none" stroke="#334155" stroke-width="4.5" stroke-linecap="round" />
              <!-- Right Eye (Happy sleeping curve) -->
              <path id="cat-eye-right" class="cat-eye" d="M 298 238 Q 308 231 318 238" fill="none" stroke="#334155" stroke-width="4.5" stroke-linecap="round" />
            </g>

            <!-- Cute Cheeks -->
            <ellipse cx="232" cy="248" rx="8" ry="5" fill="#fda4af" opacity="0.6" />
            <ellipse cx="328" cy="248" rx="8" ry="5" fill="#fda4af" opacity="0.6" />

            <!-- Nose & Tiny Smile -->
            <path d="M 277 249 L 283 249 L 280 253 Z" fill="#334155" />
            <path d="M 274 257 Q 280 262 286 257" fill="none" stroke="#334155" stroke-width="2.5" stroke-linecap="round" />
          </g>

          <!-- Interactive Active Swatting Paw (Front Left) -->
          <g id="cat-paw-active">
            <!-- Arm Path -->
            <path d="M 260 360 Q 280 380 310 405" fill="none" stroke="url(#cat-body-grad)" stroke-width="22" stroke-linecap="round" />
            <circle cx="310" cy="405" r="11" fill="url(#cat-body-grad)" />
            <!-- Paw beans (optional cute detail visible when swatting) -->
            <circle cx="310" cy="405" r="5" fill="#fda4af" opacity="0.9" class="paw-bean" />
          </g>

        </g>

        <!-- THE TOY BALL (YARN BALL) -->
        <g id="cat-toy-ball" filter="url(#soft-glow)">
          <!-- Main Ball -->
          <circle cx="420" cy="440" r="22" fill="url(#ball-grad)" />
          
          <!-- Artistic Yarn Lines -->
          <path d="M 405 430 Q 420 420 435 435" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="2" stroke-linecap="round" />
          <path d="M 402 442 Q 420 452 438 440" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="2" stroke-linecap="round" />
          <path d="M 410 422 Q 430 435 422 458" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="2" stroke-linecap="round" />
          
          <!-- Cute Loose String Tail of the Yarn -->
          <path d="M 436 448 Q 450 460 465 454 Q 475 448 485 452" fill="none" stroke="#ff7e5f" stroke-width="3" stroke-linecap="round" />
        </g>
      </svg>
      
      <!-- Interactive Speech bubble (pops up on interaction) -->
      <div class="speech-bubble" id="speech-bubble">
        <span>prr?</span>
      </div>

    </div>

    <!-- Soft minimal text overlay explaining actions -->
    <div class="interaction-hints">
      <span class="hint-item"><i class="fa-solid fa-wand-magic-sparkles"></i> Move your mouse to explore</span>
      <span class="hint-item"><i class="fa-solid fa-hand-pointer"></i> Click the cat or toy to play</span>
    </div>

    <!-- Footer links for a modern premium feel -->
    <footer class="footer">
      <a href="#" class="footer-link"><i class="fa-brands fa-github"></i> github</a>
      <a href="#" class="footer-link"><i class="fa-brands fa-twitter"></i> twitter</a>
      <a href="#" class="footer-link"><i class="fa-solid fa-envelope"></i> contact</a>
    </footer>

  </main>

  <script src="script.js"></script>
</body>
</html>
